[package]
name = "xgraph"
version = "0.1.0"
edition = "2024"
description = "Linux-native code graph daemon for Git worktrees"

[dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
cozo = { version = "0.7", default-features = false, features = ["rayon", "storage-rocksdb"] }
crossbeam-channel = "0.5"
dashmap = "6"
fs2 = "0.4"
hex = "0.4"
ignore = "0.4"
notify = "8.2"
num_cpus = "1"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "io-std", "process", "signal"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2.5"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27"

[[bench]]
name = "index"
harness = false
