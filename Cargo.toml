[package]
name = "xgraph"
version = "0.1.0"
edition = "2024"
description = "Linux-native code graph daemon for Git worktrees"

[dependencies]
[build-dependencies]
[dev-dependencies]
blake3 = "1.8"
cc = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dashmap = "6"
fs2 = "0.4"
hex = "0.4"
ignore = "0.4"
notify = "8.2"
num_cpus = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "io-std", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2.5"
